<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profielkaart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input type="checkbox" id="dark-toggle" class="dark-toggle-input">
  <label for="dark-toggle" class="dark-toggle-label">🌙 Dark mode</label>

  <main class="kaart">
    <img class="avatar"
         src="https://i.pravatar.cc/150?img=12"
         alt="Avatar van Lisa de Vries">

    <div class="inhoud">
      <h1>Lisa de Vries</h1>
      <p class="functie">Front-end Developer</p>
      <p class="bio">
        Derdejaars student die graag mooie, toegankelijke websites bouwt.
        Gek op CSS-animaties en een goede kop koffie.
      </p>

      <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>

      <a href="mailto:lisa@example.com" class="knop">Contact</a>
    </div>
  </main>

</body>
</html>
